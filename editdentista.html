        </div>
        <nav class="sidebar">

            </div>

            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        <i class="fa-solid fa-home"></i>

                <li>
                    <a href="cadasUser.html">

                    </a>

            </ul>

        <main class="content-main">
            <section class="patient-profile-card">
            <div class="profile-header">
                <i class="fa-solid fa-user-circle"></i>
                <h2>DENTISTA TESTE</h2>
            </div>

            <div class="profile-details">
                <div class="detail-item">
                    <strong><i class="fa-solid fa-id-card"></i> Setor:</strong>
                    <span>Dentistas</span>
                </div>
                <div class="detail-item">
                    <strong><i class="fa-solid fa-user"></i> Login:</strong>
                    <span>dent.teste</span>
                </div>
                <div class="detail-item">
                    <strong><i class="fa-solid fa-envelope"></i> Email:</strong>
                    <span>denttest@email.com</span>
                </div>
                <div class="detail-item">
                    <strong><i class="fa-solid fa-lock"></i> Senha:</strong>
                    <span>123456</span>
                </div>
            </div>
        <div class="title-user-edit">
            <h2>Editar Dentista</h2>
        </div>
        <form class="user-edit" action="confirmedit.html">
            <label for="edit-email">Email</label>
            <input type="text" placeholder="usermail@outlook.com">
            <label for="edit-email">Login</label>
            <input type="text" placeholder="user.login">
            <label for="edit-email">Senha</label>
            <input type="text" placeholder="******">
            <label for="edit-email">Setor</label>
            <input type="text" placeholder="Recepção">
            <button type="submit" class="primary-button">Salvar</button>
            <button type="button" class="secondary-button" onclick="history.back()">Voltar</button>
        </form>
